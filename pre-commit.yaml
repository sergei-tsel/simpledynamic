repos:
  - repo: local
    hooks:
      - id: ecs
        name: ECS
        entry: vendor/bin/ecs check --fix --config=ecs.php
        language: system
        types: [php]
        pass_filenames: true

      - id: psalm
        name: Psalm
        entry: vendor/bin/psalm --config=psalm.xml --update-baseline --output-format=github
        language: system
        types: [ php ]
        pass_filenames: true
